# 공개 사이트 자동 반영
# main에 합쳐지면 사이트를 만들어 GitHub Pages에 올린다.
# 자동 병합 장치가 병합한 뒤에도 이 파일을 직접 실행한다(auto-merge.yml의 DEPLOYS).
name: 공개 사이트 반영

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - name: 사이트 코드가 있는지 확인
        id: check
        run: |
          if [ -f package.json ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "아직 사이트 코드가 없어 반영을 건너뜁니다."; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: '22'
      - name: 사이트 만들기
        if: steps.check.outputs.ok == 'true'
        run: npm run build
      - uses: actions/configure-pages@v5
        if: steps.check.outputs.ok == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.ok == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.ok == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
