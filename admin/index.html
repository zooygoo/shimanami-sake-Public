<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SHIMANAMIの酒 管理画面</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
:root{--blue:#00508E;--deep:#003F72;--ink:#102A43;--muted:#566B80;--line:#D5E0EA;--sea:#EAF2F8;--paper:#FFFFFF}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.8 "Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;overflow-wrap:anywhere}h1,h2,p{margin:0}h1{font-size:28px;line-height:1.45}h2{font-size:22px}button,input,textarea,select{font:inherit}a{color:var(--blue)}button{cursor:pointer}button:disabled{cursor:default;opacity:.6}[hidden]{display:none!important}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.wrap{max-width:1240px;margin:auto;padding:0 16px}.header{border-bottom:1px solid var(--line)}.header .wrap{min-height:80px;display:flex;align-items:center;gap:16px}.header img{width:48px;height:48px}.header b{font-size:17px}.header .back{margin-left:auto;font-size:14px}.page{padding-block:48px 64px}.lead{color:var(--muted);font-size:14px;margin-top:8px}.login{max-width:480px;margin:32px 0;border:1px solid var(--line);padding:28px}.login h2{margin-bottom:20px}.field{display:grid;gap:6px;margin-bottom:20px;min-width:0}.field label{font-size:14px;font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:2px;padding:10px 12px;min-height:50px;width:100%;background:var(--paper);color:var(--ink)}.field textarea{min-height:120px;resize:vertical;line-height:1.8}.field input:disabled,.field textarea:disabled,.field select:disabled{background:var(--sea);opacity:1;color:var(--ink)}.field input[type=checkbox]{width:24px;min-height:24px;margin:0}.btn{min-height:50px;padding:0 24px;border:1px solid var(--blue);border-radius:2px;font-size:14px;font-weight:700;background:var(--blue);color:var(--paper)}.btn:hover:enabled{background:var(--deep)}.ghost{background:var(--paper);color:var(--blue)}.ghost:hover:enabled{background:var(--sea)}.status{margin:24px 0;padding:16px 20px;background:var(--sea);border:1px solid var(--line);font-size:14px}.workspace{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;margin-top:32px}.side{display:grid;align-content:start;gap:8px}.side button{min-height:50px;text-align:left;padding:10px 16px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);font-size:14px;font-weight:700}.side button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--paper)}.panel{min-width:0}.panel-head{display:flex;align-items:center;gap:16px;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}.wide{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:12px;border-top:1px solid var(--line);padding-top:24px}.selection{display:flex;align-items:end;gap:16px;margin:24px 0}.selection .field{flex:1;margin:0}.small{font-size:13px;color:var(--muted)}.stats{border-collapse:collapse;width:100%;margin:24px 0}.stats td,.stats th{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}.stats th{background:var(--sea)}.stats td:last-child{text-align:right;font-variant-numeric:tabular-nums}.sns-row{display:grid;gap:8px;border-bottom:1px solid var(--line);padding-block:16px}.sns-row .btn{justify-self:start}.review{width:min(calc(100% - 32px),800px);max-height:calc(100vh - 32px);overflow:auto;padding:24px;border:1px solid var(--line);border-radius:2px;color:var(--ink)}.review::backdrop{background:var(--sea);opacity:.85}.review dl{display:grid;grid-template-columns:8em minmax(0,1fr);gap:12px 20px;margin:24px 0}.review dt{font-size:14px;font-weight:700;color:var(--muted)}.review dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}a.btn{display:inline-flex;align-items:center;text-decoration:none}.save-state{align-self:center;font-size:14px;color:var(--muted)}
@media(max-width:860px){.page{padding-block:32px 64px}.workspace{grid-template-columns:1fr;gap:24px}.side{display:flex;flex-wrap:wrap;gap:8px}.side button{min-height:44px;padding:8px 16px}.form-grid{grid-template-columns:1fr}.login{padding:20px}.header .wrap{gap:12px}.header b{font-size:14px}.header .back{font-size:12px}.selection{flex-wrap:wrap}.selection .field{flex-basis:100%}.review dl{grid-template-columns:1fr;gap:4px}.review dd{margin-bottom:16px}}
.photo-preview{display:block;width:100%;max-width:320px;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--line)}.photo-actions{display:flex;flex-wrap:wrap;gap:12px}

.stats-filter{margin:24px 0;padding:20px;background:var(--sea);border:1px solid var(--line)}.stats-filter .form-grid{gap:0 16px}.stats-filter .field{margin-bottom:16px}.stats-presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.stats-presets .btn{min-height:44px;padding:8px 16px}.stats-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:24px 0;border:1px solid var(--line)}.stats-summary>div{padding:16px;border-right:1px solid var(--line)}.stats-summary>div:last-child{border:0}.stats-summary dt{font-size:13px;color:var(--muted)}.stats-summary dd{font-size:28px;font-weight:700;color:var(--blue);margin:8px 0 0;font-variant-numeric:tabular-nums}.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.stats-card{min-width:0}.stats-card h3{margin:0;padding:8px 12px;background:var(--sea);color:var(--blue);font-size:17px}.stats-card figure{margin:16px 0}.stats-card svg{display:block;width:100%;height:auto}.stats-card .stats{margin:16px 0}.stats details{font-size:14px}.stats-card details{margin-bottom:24px}.stats-card summary,.stats-reference summary{cursor:pointer;color:var(--blue);min-height:44px;padding:8px 0;font-size:14px}.stats-range{font-weight:700;color:var(--blue);margin:16px 0}.stats-reference{margin-top:24px}.stats-filter input{min-width:0}.stats-summary,.stats td{overflow-wrap:anywhere}.stats td:last-child{width:80px;white-space:nowrap}.stats-card caption{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%)}
@media(max-width:1080px){.stats-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.stats-summary>div{border-bottom:1px solid var(--line)}.stats-summary>div:nth-child(2){border-right:0}.stats-summary>div:nth-child(3){border-bottom:0}}
@media(max-width:860px){.stats-grid{grid-template-columns:1fr}.stats-filter{padding:16px}.stats-summary dd{font-size:24px}.stats td,.stats th{padding:12px}.stats-summary>div{padding:12px}}
.maker-media-list{display:grid;gap:20px}.maker-media-row{display:grid;gap:12px;border-bottom:1px solid var(--line);padding-bottom:20px}.logo-preview{object-fit:contain;background:var(--paper)}
</style></head><body>

 remove.addEventListener('click',()=>{current.photo='';pendingPhoto=null;input.value='';image.hidden=true;image.removeAttribute('src');remove.hidden=true;markDirty();note.textContent='保存すると写真の表示を外します。';});

 const state=document.createElement('p');state.className='small';state.setAttribute('role','status');state.textContent=boot.photosReady?'JPEG・PNG・WebP、1枚10MB以下。保存するまで送信しません。':'画像の保存先は接続準備中です。';

async function preparePhoto(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('JPEG・PNG・WebPの写真を選択してください。');
 if(file.size>10*1024*1024)throw new Error('10MB以下の写真を選択してください。');
 let bitmap;try{bitmap=await createImageBitmap(file);}catch{throw new Error('写真を読み込めません。別の写真を選択してください。');}
 try{
  const canvas=document.createElement('canvas');let edge=Math.min(1600,Math.max(bitmap.width,bitmap.height));
  while(edge>=Math.min(400,Math.max(bitmap.width,bitmap.height))){
   const scale=edge/Math.max(bitmap.width,bitmap.height);canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const context=canvas.getContext('2d');context.fillStyle='#FFFFFF';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(bitmap,0,0,canvas.width,canvas.height);
   for(const quality of [.85,.7,.5]){const result=canvas.toDataURL('image/jpeg',quality).split(',')[1];if(result&&Math.floor(result.length*3/4)<=256000)return result;}
   edge=Math.floor(edge*.75);
  }
  throw new Error('写真を小さくできませんでした。別の写真を選択してください。');
 }finally{bitmap.close();}
}

 rows.forEach(([label,count],index)=>{const height=count/maximum*192,x=40+index*step+step*.15;const rect=shape('rect',{x,y:220-height,width:step*.7,height,fill:'var(--blue)'});const tooltip=document.createElementNS(ns,'title');tooltip.textContent=label+'：'+count+'回';rect.append(tooltip);

async function showStats(){
 const box=$('stats-content'),message=$('stats-message'),request=++statsRequest;box.replaceChildren();message.textContent='';
 if(!boot.connected){message.textContent='Google接続後に閲覧数を表示します。';statsControls(false);return;}
 const filters={startDate:$('stats-start').value,endDate:$('stats-end').value,startTime:$('stats-from').value,endTime:$('stats-to').value};
 if(filters.startDate&&filters.endDate&&filters.startDate>filters.endDate){message.textContent='終了日は開始日以降にしてください。';return;}
 if(filters.startTime>=filters.endTime){message.textContent='終了時刻は開始時刻より後にしてください。';return;}
 statsControls(true);message.textContent='集計しています。';
 try{
  const result=await rpc({action:'stats',...filters});if(request!==statsRequest||section!=='stats'||!token)return;
  if(!result.dashboard)throw new Error('管理画面の更新が必要です。最新のApps Scriptを反映してください。');
  const dashboard=result.dashboard;statsToday=dashboard.today;
  $('stats-start').value=dashboard.range.startDate;$('stats-end').value=dashboard.range.endDate;
  const range=document.createElement('p');range.className='stats-range';range.textContent=dashboard.range.startDate+' 〜 '+dashboard.range.endDate+' ／ 毎日 '+dashboard.range.startTime+' 〜 '+dashboard.range.endTime+'（日本時間）';box.append(range);
  const cards=document.createElement('dl');cards.className='stats-summary';
  for(const [key,label] of [['views','サイト閲覧数'],['makers','造り手ページ閲覧数'],['experiences','体験リンククリック数'],['events','イベントリンククリック数']]){const card=document.createElement('div'),name=document.createElement('dt'),value=document.createElement('dd');name.textContent=label;value.dataset.metric=key;value.textContent=dashboard.totals[key]===null?'未計測':dashboard.totals[key].toLocaleString('ja-JP')+'回';card.append(name,value);cards.append(card);}box.append(cards);
  const charts=document.createElement('div');charts.className='stats-grid';statsChart(charts,'日別の閲覧数',dashboard.daily);statsChart(charts,'時間帯別の閲覧数',dashboard.hourly);box.append(charts);
  const note=document.createElement('p');note.className='small';note.textContent='選択した期間・時間帯の閲覧数です。日別は閲覧記録のある日を表示します。今日の値は現在までの集計です。';box.append(note);
  const ranks=document.createElement('div');ranks.className='stats-grid';
  const sorted=rows=>rows.sort((a,b)=>(b[1]||0)-(a[1]||0)||a[0].localeCompare(b[0],'ja'));
  statsRank(ranks,'造り手ページの閲覧数',sorted(data.makers.map(record=>[record.name,dashboard.pages['/makers/'+record.id+'/']||0])));
  statsRank(ranks,'体験リンクのクリック数',sorted(data.experiences.map(record=>[record.title,result.clicksMeasured===false?null:dashboard.links['experience:'+record.id]||0])));
  statsRank(ranks,'イベントリンクのクリック数',sorted(data.events.map(record=>[record.title,result.clicksMeasured===false?null:dashboard.links['event:'+record.id]||0])));
  statsRank(ranks,'閲覧が多い日',dashboard.popularDays);box.append(ranks);
  const reference=document.createElement('details');reference.className='stats-reference';const summary=document.createElement('summary');summary.textContent='今日・今月・累計と外部リンクの集計を見る';reference.append(summary);
  statsTable(reference,'閲覧数（全期間の参考値）',[['今日の閲覧数',result.counts.today],['最近7日間',result.counts.week],['今月の閲覧数',result.counts.month],['累計閲覧数',result.counts.total]]);
  statsTable(reference,'ページ別（選択期間）',Object.entries(dashboard.pages).map(([path,count])=>[path==='/'?'トップページ':data.makers.find(x=>path==='/makers/'+x.id+'/')?.name||path,count]));
  if(result.clicksMeasured!==false){
   const labels={website:'公式サイト',directions:'経路案内'},links=Object.entries(dashboard.links).map(([target,count])=>{const [kind,id,link,index]=target.split(':');const record=data[kind==='maker'?'makers':kind==='experience'?'experiences':'events'].find(x=>x.id===id);return [(record?.name||record?.title||target)+(kind==='maker'?'（'+(link==='sns'?record?.sns[Number(index)]?.name||'SNS':labels[link]||link)+'）':''),count];});
   statsTable(reference,'外部リンク（全期間の参考値）',[['今日のクリック数',result.clicks.today],['今月のクリック数',result.clicks.month],['累計クリック数',result.clicks.total]]);
   statsTable(reference,'外部リンク（選択期間）',sorted(links));
  }
  box.append(reference);message.textContent='表示を更新しました。'+(result.clicksMeasured===false?'クリック数は未計測です。クリック記録を開始する前のデータです。':'')+(dashboard.skipped?'日付・時刻・ページなどが不正または未来の記録'+dashboard.skipped+'件を除外しました。':'')+' 検証時のアクセスも含みます。';
 }catch(error){if(request===statsRequest&&section==='stats')message.textContent=error.message+'「表示する」で再試行できます。';}
 finally{if(request===statsRequest)statsControls(false);}
}
$('stats-filter').addEventListener('submit',event=>{event.preventDefault();if(!statsLoading)showStats();});
document.querySelectorAll('[data-stats-period]').forEach(button=>button.addEventListener('click',()=>{
 if(statsLoading)return;
 const today=statsToday||new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date()),period=button.dataset.statsPeriod;
 $('stats-end').value=period==='all'?'':today;
 $('stats-start').value=period==='all'?'':period==='month'?today.slice(0,7)+'-01':period==='week'?new Date(Date.parse(today+'T00:00:00Z')-6*86400000).toISOString().slice(0,10):today;
 $('stats-from').value='00:00';$('stats-to').value='24:00';showStats();
}));
$('login').addEventListener('submit',async event=>{event.preventDefault();if(busy||!connectionReady||!boot.connected)return;if(boot.needsSetup&&$('password').value!==$('confirm').value){status('確認用のパスワードが一致しません。');return;}busyState(true);status('ログインを確認しています。');try{const key=await verifier($('password').value);$('password').value='';$('confirm').value='';if(boot.needsSetup){await rpc({action:'setup',verifier:key});boot.needsSetup=false;$('confirm-field').hidden=true;}$('login-title').textContent='管理者ログイン';const result=await rpc({action:'login',verifier:key});token=result.token;sessionStorage.setItem('shimanami.admin.session',token);await load();status('');}catch(error){status(error.message);}finally{busyState(false);}});
function editedRecord(){const record=structuredClone(current);definitions[section].forEach(([key,,type])=>{const input=$('input-'+key);record[key]=type==='booking-visibility'?(input.checked?'予約サイトへ':'非表示'):type==='published'?!input.checked:type==='maker-media'?(key==='logo'?makerMedia.logo.path:makerMedia.photos.map(item=>item.path)):type==='photo'?current.photo||'':type==='checkbox'?input.checked:key==='sns'?[...input.querySelectorAll('.sns-row')].map(row=>({name:row.querySelector('[data-sns=name]').value,url:row.querySelector('[data-sns=url]').value})):type==='number'?Number(input.value):input.value;});if(section==='events'&&!record.end_date)record.end_date=record.start_date;return record;}
async function saveRecord(record){
 if(busy||!boot.connected)return;const collection=section;busyState(true);status('保存しています。');
 try{
  if(collection==='makers'){for(const item of [makerMedia.logo,...makerMedia.photos]){if(item.pending){status('画像を保存しています。');const uploaded=await rpc({action:'upload',collection,base64:item.pending.base64});item.path=uploaded.path;}}record.logo=makerMedia.logo.path;record.photos=makerMedia.photos.map(item=>item.path);}
  if(pendingPhoto){status('写真を保存しています。');const uploaded=await rpc({action:'upload',collection,base64:pendingPhoto.base64});record.photo=uploaded.path;}
  const result=await rpc({action:'save',collection,record,revision,create:$('record').value===''});pendingPhoto=null;revision=result.revision;
  const index=data[collection].findIndex(x=>x.id===record.id);if(index<0)data[collection].push(structuredClone(record));else data[collection][index]=structuredClone(record);
  current=structuredClone(record);dirty=false;if($('review').open)$('review').close();
  try{await load(record.id);status('保存しました。サイトを開き直すと反映されます。');}
  catch{showEditor(record.id);status('保存は完了しましたが、最新の内容を取得できませんでした。再読み込みして確認してください。');}
  const path=collection==='makers'?'makers/'+record.id+'/':collection==='experiences'?'#experience':'#events';
  $('saved-view').href=siteBase+path;$('saved-view').hidden=false;
 }catch(error){status(error.message);}finally{busyState(false);}
}
$('edit-form').addEventListener('submit',event=>{event.preventDefault();if(!busy)saveRecord(editedRecord());});
$('preview').addEventListener('click',()=>{
 if(busy||!boot.connected||!$('edit-form').reportValidity())return;reviewRecord=editedRecord();$('review-fields').replaceChildren();
 definitions[section].forEach(([key,label,type])=>{if(type==='hidden')return;const title=document.createElement('dt'),value=document.createElement('dd');title.textContent=label;const content=reviewRecord[key];if(type==='maker-media'){const list=key==='logo'?[makerMedia.logo]:makerMedia.photos;for(const item of list){if(!item.path&&!item.pending)continue;const image=document.createElement('img');image.className='photo-preview'+(key==='logo'?' logo-preview':'');image.alt=key==='logo'?'保存するロゴ':'保存する写真';value.append(image);makerImagePreview(image,item);}if(!value.children.length)value.textContent='画像なし';$('review-fields').append(title,value);return;}if(type==='photo'){const source=pendingPhoto?.preview||$('photo-preview')?.getAttribute('src');if(source){const image=document.createElement('img');image.src=source;image.alt='保存する写真';image.className='photo-preview';value.append(image);}else value.textContent='写真なし';$('review-fields').append(title,value);return;}value.textContent=type==='booking-visibility'?(content==='非表示'?'非表示':'表示'):type==='published'?(content?'非公開':'公開'):key==='sns'?content.map(x=>x.name+'：'+x.url).join('\n')||'未入力':type==='checkbox'?(content?'はい':'いいえ'):String(content??'')||'未入力';$('review-fields').append(title,value);});
 $('review-status').hidden=true;$('review').showModal();$('review-title').focus({preventScroll:true});$('review').scrollTop=0;
});
$('review-save').addEventListener('click',()=>saveRecord(reviewRecord));
$('review-back').addEventListener('click',()=>{if(!busy)$('review').close();});
$('review').addEventListener('cancel',event=>{if(busy)event.preventDefault();});
document.querySelectorAll('[data-section]').forEach(button=>button.addEventListener('click',()=>{if(!busy&&confirmLeave())showSection(button.dataset.section);}));
$('record').addEventListener('change',()=>{if(confirmLeave())selectRecord(Number($('record').value));else $('record').value=data[section].findIndex(x=>x.id===current.id);});
$('add').addEventListener('click',()=>{if(confirmLeave()){selectRecord(-1);$('record').value='';}});
$('reload').addEventListener('click',async()=>{if(!confirmLeave())return;try{await load();status('最新の内容を読み込みました。');}catch(error){status(error.message);}});
$('logout').addEventListener('click',async()=>{if(!confirmLeave())return;try{await rpc({action:'logout'});showLogin();status('ログアウトしました。');}catch(error){status(error.message);}});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
function initializeScreen(){
 if(!boot.connected){$('password').disabled=true;status('Google接続の準備中です。ログインと保存、閲覧数の記録はまだ利用できません。');$('login-note').textContent='接続後は管理者パスワードだけでログインします。';if(boot.previewData){data=boot.previewData;showEditor();$('login').hidden=false;$('logout').hidden=true;}}
 else if(boot.needsSetup){
  if(boot.transport==='http'){$('password').disabled=true;$('login-note').textContent='所有者による初期設定が必要です。';status('所有者による管理者パスワードの初期設定が必要です。');}
  else{$('login-title').textContent='管理者パスワードの初期設定';$('confirm-field').hidden=false;$('confirm').required=true;$('password').autocomplete='new-password';$('login-button').textContent='パスワードを設定する';$('login-note').textContent='数字のみでも、好きな長さで設定できます。';if(!boot.canSetup)status('初期設定には所有者のGoogleアカウントでの確認が必要です。');}
 }
 else if(token)load().catch(error=>{showLogin();status(error.message);});
 busyState(false);
}
async function initialize(){
 if(boot.transport!=='http'||!boot.endpoint){connectionReady=true;initializeScreen();return;}
 connectionReady=false;$('password').disabled=true;$('connection-retry').hidden=true;busyState(true);status('管理画面の接続を確認しています。');
 try{
  const result=await httpRequest();
  if(!result.ok||result.apiVersion!==1||typeof result.connected!=='boolean'||typeof result.needsSetup!=='boolean'||typeof result.salt!=='string'||!result.needsSetup&&!result.salt)throw new Error('管理画面の接続先の更新が必要です。');
  for(const key of ['connected','photosReady','salt','needsSetup'])boot[key]=result[key];boot.canSetup=false;
  connectionReady=true;$('password').disabled=!boot.connected||boot.needsSetup;status('');initializeScreen();
 }catch(error){status(error.message);$('connection-retry').hidden=false;busyState(false);}
}
$('connection-retry').addEventListener('click',()=>{if(!busy)initialize();});
initialize();
