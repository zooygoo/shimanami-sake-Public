</style></head><body>
<header class="header"><div class="wrap"><img src="__LOGO_DATA__" alt=""><b>SHIMANAMIの酒</b><a class="back" href="https://shimanami-sake-preview.woogie3.chatgpt.site/" target="_blank" rel="noopener noreferrer">サイトを見る</a></div></header>
<main class="wrap page"><h1>管理画面</h1><p class="lead">造り手、体験、イベントの内容を編集します。</p>
<p id="status" class="status" role="status" aria-live="polite" hidden></p>

<form id="login" class="login"><h2 id="login-title">管理者ログイン</h2><div class="field"><label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div id="confirm-field" class="field" hidden><label for="confirm">パスワード（確認）</label><input id="confirm" type="password" autocomplete="new-password"></div><button id="login-button" class="btn" type="submit">ログイン</button><p class="small" id="login-note">管理者のパスワードを入力してください。</p></form>
<div class="workspace" id="workspace" hidden><nav class="side" aria-label="管理メニュー"><button type="button" data-section="makers" aria-pressed="true">造り手</button><button type="button" data-section="experiences" aria-pressed="false">体験</button><button type="button" data-section="events" aria-pressed="false">イベント</button><button type="button" data-section="stats" aria-pressed="false">閲覧数</button><button type="button" id="logout">ログアウト</button></nav>
<section class="panel"><div class="panel-head"><h2 id="section-title">造り手</h2><span class="small" id="mode"></span></div><div id="edit-panel"><div class="selection"><div class="field"><label for="record">編集する項目</label><select id="record"></select></div><button type="button" class="btn ghost" id="add" hidden>新しく追加</button></div><form id="edit-form"><div class="form-grid" id="fields"></div><div class="actions"><button class="btn" id="save" type="submit">保存する</button><button class="btn ghost" id="preview" type="button">変更内容を確認</button><button class="btn ghost" id="reload" type="button">再読み込み</button><a id="saved-view" class="btn ghost" target="_blank" rel="noopener noreferrer" hidden>サイトで変更を確認</a><span class="save-state" id="save-state"></span></div></form></div><div id="stats-panel" hidden><p class="small">日本時間で集計したページの閲覧回数です。訪問者の人数とは異なります。</p>
<form id="stats-filter" class="stats-filter"><div class="form-grid"><div class="field"><label for="stats-start">開始日</label><input id="stats-start" type="date" aria-describedby="stats-filter-note"></div><div class="field"><label for="stats-end">終了日</label><input id="stats-end" type="date" aria-describedby="stats-filter-note"></div><div class="field"><label for="stats-from">開始時刻（毎日）</label><input id="stats-from" type="time" value="00:00" required></div><div class="field"><label for="stats-to">終了時刻（毎日）</label><input id="stats-to" type="text" inputmode="numeric" value="24:00" pattern="([01][0-9]|2[0-3]):[0-5][0-9]|24:00" required aria-describedby="stats-filter-note"></div></div><p class="small" id="stats-filter-note">同じ日付を選ぶと1日分を表示します。空欄は全期間。日付は両端を含み、時刻は開始を含み終了を含みません（終日は00:00〜24:00）。</p><button class="btn" type="submit" id="stats-apply">表示する</button><div class="stats-presets" aria-label="期間を選ぶ"><button class="btn ghost" type="button" data-stats-period="today">今日</button><button class="btn ghost" type="button" data-stats-period="week">最近7日間</button><button class="btn ghost" type="button" data-stats-period="month">今月</button><button class="btn ghost" type="button" data-stats-period="all">全期間</button></div></form>
<p id="stats-message" class="small" role="status" aria-live="polite"></p><div id="stats-content" aria-busy="false"></div></div></section></div>
</main>
<dialog id="review" class="review" aria-labelledby="review-title"><h2 id="review-title" tabindex="-1">変更内容の確認</h2><p class="small">まだ保存していません。</p><dl id="review-fields"></dl><p id="review-status" class="status" role="status" hidden></p><div class="actions"><button type="button" id="review-save" class="btn">この内容で保存する</button><button type="button" id="review-back" class="btn ghost">修正に戻る</button></div></dialog>
<script>

const definitions={makers:[['name','事業者名'],['kind','種類',['日本酒','ビール','ワイン','リキュール']],['sub','補助表記'],['area','地域'],['description','一覧の紹介文','textarea'],['body','詳しい紹介文','textarea'],['logo','ロゴ','maker-media'],['photos','事業所の写真','maker-media'],['postal','郵便番号'],['address','住所'],['tel','電話'],['website','公式サイト'],['sns','SNS','sns'],['hours','営業時間'],['order','表示順','number']],experiences:[['id','管理用ID','hidden'],['category','種類',['見学','ペアリング','ガイド','診断','周遊']],['title','タイトル'],['description','紹介文','textarea'],['photo','写真','photo'],['maker_id','関連する造り手','maker-select'],['booking_url','予約URL'],['booking_label','予約サイトを表示する','booking-visibility'],['sample','画面に表示する','published']],events:[['id','管理用ID','hidden'],['title','タイトル'],['description','内容','textarea'],['photo','写真','photo'],['start_date','開始日','date'],['end_date','終了日（複数日にわたる場合）','date'],['time_text','時間'],['url','案内ページのURL'],['sample','サイトに公開する','published']]};
const titles={makers:'造り手',experiences:'体験',events:'イベント',stats:'閲覧数'};
let token=sessionStorage.getItem('shimanami.admin.session')||'',data=null,revision=0,section='makers',current=null,dirty=false,busy=false,reviewRecord=null,pendingPhoto=null,makerMedia=null,statsRequest=0,statsLoading=false,statsToday='',connectionReady=boot.transport!=='http';
const $=id=>document.getElementById(id);
function status(text){for(const id of ['status','review-status']){$(id).textContent=text;$(id).hidden=!text;}}

async function httpRequest(request){
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(boot.endpoint||''))throw new Error('管理画面の接続先を確認してください。');
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),25000);
 try{
  const response=await fetch(boot.endpoint+(request?'':'?action=admin-bootstrap'),{method:request?'POST':'GET',mode:'cors',credentials:'omit',redirect:'follow',cache:'no-store',referrerPolicy:'no-referrer',signal:controller.signal,...(request?{headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({...request,api:'admin-v1'})}:{})});

 }catch(error){
  if(error.name==='AbortError')throw new Error('応答に時間がかかっています。保存済みの可能性もあるため、最新の内容を再読み込みして確認してください。');

function rpc(request){
 if(boot.transport==='http'){
  if(!connectionReady||!boot.connected)return Promise.reject(new Error('保存先がまだ接続されていません。'));
  return httpRequest({...request,token:request.token??token}).then(result=>{if(!result.ok)throw new Error(result.error||'操作に失敗しました。');return result;});
 }
 return new Promise((resolve,reject)=>{if(!boot.connected||!window.google?.script?.run){reject(new Error('保存先がまだ接続されていません。'));return;}google.script.run.withSuccessHandler(result=>result?.ok?resolve(result):reject(new Error(result?.error||'操作に失敗しました。'))).withFailureHandler(()=>reject(new Error('通信に失敗しました。最新の内容を再読み込みして確認してください。'))).rpc({...request,token:request.token??token});});
}
async function verifier(password){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(boot.salt),iterations:600000,hash:'SHA-256'},key,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function busyState(value){busy=value;document.querySelectorAll('#fields input,#fields textarea,#fields select,#fields button').forEach(control=>{control.disabled=value||!boot.connected||control.dataset.photoControl==='true'&&!boot.photosReady||control.dataset.boundaryDisabled==='true';});for(const id of ['save','preview','review-save'])$(id).disabled=value||!boot.connected;for(const id of ['record','reload','review-back'])$(id).disabled=value;$('add').disabled=value||!boot.connected;$('login-button').disabled=value||!connectionReady||!boot.connected||boot.needsSetup&&!boot.canSetup;}

function showLogin(){statsRequest++;statsLoading=false;$('stats-content').replaceChildren();token='';sessionStorage.removeItem('shimanami.admin.session');$('workspace').hidden=true;$('login').hidden=false;}
function showEditor(selectedId){ $('login').hidden=true;$('workspace').hidden=false;$('mode').textContent=boot.connected?'Googleスプレッドシートに保存':'画面プレビュー・保存先未接続';showSection(section,selectedId); }
function showSection(key,selectedId){statsRequest++;statsLoading=false;section=key;document.querySelectorAll('[data-section]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.section===key)));$('section-title').textContent=titles[key];$('stats-panel').hidden=key!=='stats';$('edit-panel').hidden=key==='stats';if(key==='stats'){showStats();return;}$('record').replaceChildren();data[key].forEach((record,index)=>{const option=document.createElement('option');option.value=index;option.textContent=record.name||record.title||record.id;$('record').append(option);});$('add').hidden=key==='makers';$('add').disabled=!boot.connected;const found=data[key].findIndex(x=>x.id===selectedId);selectRecord(found<0?0:found);}
function selectRecord(index){pendingPhoto=null;current=structuredClone(data[section][index]||blankRecord());makerMedia=section==='makers'?{logo:{path:current.logo},photos:current.photos.map(path=>({path}))}:null;$('record').value=data[section][index]?String(index):'';$('saved-view').hidden=true;dirty=false;$('save-state').textContent='';$('fields').replaceChildren();definitions[section].forEach(([key,label,type])=>{const box=document.createElement('div');box.className='field'+(type==='textarea'?' wide':'');box.hidden=type==='hidden';const name=document.createElement('label');name.htmlFor='input-'+key;name.textContent=label;
if(type==='maker-media'){makerMediaField(box,name,key);$('fields').append(box);return;}
if(type==='photo'){photoField(box,name);$('fields').append(box);return;}
if(key==='sns'){
 const list=document.createElement('div');list.id='input-sns';
 function addRow(value={name:'',url:''}){const row=document.createElement('div');row.className='sns-row';for(const [field,caption] of [['name','名前'],['url','URL']]){const captionElement=document.createElement('label');captionElement.textContent=caption;const control=document.createElement('input');control.dataset.sns=field;control.value=value[field]||'';control.type=field==='url'?'url':'text';control.required=true;control.disabled=!boot.connected;control.addEventListener('input',markDirty);captionElement.append(control);row.append(captionElement);}const remove=document.createElement('button');remove.type='button';remove.className='btn ghost';remove.textContent='削除';remove.disabled=!boot.connected;remove.addEventListener('click',()=>{row.remove();markDirty();});row.append(remove);list.append(row);}
 (current.sns||[]).forEach(addRow);const add=document.createElement('button');add.type='button';add.className='btn ghost';add.textContent='SNSを追加';add.disabled=!boot.connected;add.addEventListener('click',()=>{addRow();markDirty();});box.append(name,list,add);$('fields').append(box);return;
}
let input;if(type==='maker-select'){input=document.createElement('select');for(const record of [{id:'',name:'関連なし'},...data.makers]){const option=document.createElement('option');option.value=record.id;option.textContent=record.name;input.append(option);}}else if(Array.isArray(type)){input=document.createElement('select');type.forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;input.append(option);});}else{input=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=['published','booking-visibility'].includes(type)?'checkbox':type||'text';}input.id='input-'+key;input.name=key;input.disabled=!boot.connected;if(['checkbox','published','booking-visibility'].includes(type))input.checked=type==='published'?!current[key]:type==='booking-visibility'?current[key]!=='非表示':Boolean(current[key]);else input.value=key==='booking_url'&&/^#(?:experience|events)$/.test(current[key]||'')?'':key==='sns'?JSON.stringify(current[key],null,2):current[key]??'';if(['name','title','id','start_date'].includes(key))input.required=true;if(key==='order'){input.min='1';input.step='1';}if(key==='id'&&data[section].some(x=>x.id===current.id))input.readOnly=true;if(input.tagName!=='SELECT'&&input.type!=='checkbox')input.maxLength=10000;input.addEventListener('input',markDirty);box.append(name,input);if(key==='booking_url'){input.placeholder='https://';const note=document.createElement('p');note.className='small';note.textContent='予約サイトのURLを入力してください。URLがなくても体験は表示できます。予約ボタンはURLを登録すると表示されます。';box.append(note);}if(type==='maker-select'){const note=document.createElement('p');note.className='small';note.textContent='「画面に表示する」を選ぶと、関連する造り手の詳細にも表示されます。予約ボタンは別に設定できます。';box.append(note);}$('fields').append(box);});$('save').disabled=!boot.connected;}
function photoField(box,label){
 box.classList.add('wide');const input=document.createElement('input');input.id='input-photo';input.type='file';input.accept='image/jpeg,image/png,image/webp';input.hidden=true;input.dataset.photoControl='true';input.disabled=!boot.connected||!boot.photosReady;input.setAttribute('aria-describedby','photo-note');

 const remove=document.createElement('button');remove.id='photo-remove';remove.type='button';remove.className='btn ghost';remove.textContent='写真を外す';remove.disabled=!boot.connected;remove.hidden=!current.photo;
 remove.addEventListener('click',()=>{current.photo='';pendingPhoto=null;input.value='';image.hidden=true;image.removeAttribute('src');remove.hidden=true;markDirty();note.textContent='保存すると写真の表示を外します。';});
 input.addEventListener('change',async()=>{
  const file=input.files[0];if(!file||busy)return;busyState(true);note.textContent='写真を読み込んでいます。';

 try{
  const canvas=document.createElement('canvas');let edge=Math.min(1600,Math.max(bitmap.width,bitmap.height));
  while(edge>=Math.min(400,Math.max(bitmap.width,bitmap.height))){
   const scale=edge/Math.max(bitmap.width,bitmap.height);canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const context=canvas.getContext('2d');context.fillStyle='#FFFFFF';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(bitmap,0,0,canvas.width,canvas.height);
   for(const quality of [.85,.7,.5]){const result=canvas.toDataURL('image/jpeg',quality).split(',')[1];if(result&&Math.floor(result.length*3/4)<=256000)return result;}
   edge=Math.floor(edge*.75);
  }
  throw new Error('写真を小さくできませんでした。別の写真を選択してください。');
 }finally{bitmap.close();}
}

  if(!result.ok||result.apiVersion!==1||typeof result.connected!=='boolean'||typeof result.needsSetup!=='boolean'||typeof result.salt!=='string'||!result.needsSetup&&!result.salt)throw new Error('管理画面の接続先の更新が必要です。');
  for(const key of ['connected','photosReady','salt','needsSetup'])boot[key]=result[key];boot.canSetup=false;
  connectionReady=true;$('password').disabled=!boot.connected||boot.needsSetup;status('');initializeScreen();
 }catch(error){status(error.message);$('connection-retry').hidden=false;busyState(false);}
}
$('connection-retry').addEventListener('click',()=>{if(!busy)initialize();});
initialize();
