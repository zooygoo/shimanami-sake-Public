<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SHIMANAMIの酒 管理画面</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
:root{--blue:#00508E;--deep:#003F72;--ink:#102A43;--muted:#566B80;--line:#D5E0EA;--sea:#EAF2F8;--paper:#FFFFFF}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.8 "Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;overflow-wrap:anywhere}h1,h2,p{margin:0}h1{font-size:28px;line-height:1.45}h2{font-size:22px}button,input,textarea,select{font:inherit}a{color:var(--blue)}button{cursor:pointer}button:disabled{cursor:default;opacity:.6}[hidden]{display:none!important}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.wrap{max-width:1240px;margin:auto;padding:0 16px}.header{border-bottom:1px solid var(--line)}.header .wrap{min-height:80px;display:flex;align-items:center;gap:16px}.header img{width:48px;height:48px}.header b{font-size:17px}.header .back{margin-left:auto;font-size:14px}.page{padding-block:48px 64px}.lead{color:var(--muted);font-size:14px;margin-top:8px}.login{max-width:480px;margin:32px 0;border:1px solid var(--line);padding:28px}.login h2{margin-bottom:20px}.field{display:grid;gap:6px;margin-bottom:20px;min-width:0}.field label{font-size:14px;font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:2px;padding:10px 12px;min-height:50px;width:100%;background:var(--paper);color:var(--ink)}.field textarea{min-height:120px;resize:vertical;line-height:1.8}.field input:disabled,.field textarea:disabled,.field select:disabled{background:var(--sea);opacity:1;color:var(--ink)}.field input[type=checkbox]{width:24px;min-height:24px;margin:0}.btn{min-height:50px;padding:0 24px;border:1px solid var(--blue);border-radius:2px;font-size:14px;font-weight:700;background:var(--blue);color:var(--paper)}.btn:hover:enabled{background:var(--deep)}.ghost{background:var(--paper);color:var(--blue)}.ghost:hover:enabled{background:var(--sea)}.status{margin:24px 0;padding:16px 20px;background:var(--sea);border:1px solid var(--line);font-size:14px}.workspace{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;margin-top:32px}.side{display:grid;align-content:start;gap:8px}.side button{min-height:50px;text-align:left;padding:10px 16px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);font-size:14px;font-weight:700}.side button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--paper)}.panel{min-width:0}.panel-head{display:flex;align-items:center;gap:16px;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}.wide{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:12px;border-top:1px solid var(--line);padding-top:24px}.selection{display:flex;align-items:end;gap:16px;margin:24px 0}.selection .field{flex:1;margin:0}.small{font-size:13px;color:var(--muted)}.stats{border-collapse:collapse;width:100%;margin:24px 0}.stats td,.stats th{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}.stats th{background:var(--sea)}.stats td:last-child{text-align:right;font-variant-numeric:tabular-nums}.sns-row{display:grid;gap:8px;border-bottom:1px solid var(--line);padding-block:16px}.sns-row .btn{justify-self:start}.review{width:min(calc(100% - 32px),800px);max-height:calc(100vh - 32px);overflow:auto;padding:24px;border:1px solid var(--line);border-radius:2px;color:var(--ink)}.review::backdrop{background:var(--sea);opacity:.85}.review dl{display:grid;grid-template-columns:8em minmax(0,1fr);gap:12px 20px;margin:24px 0}.review dt{font-size:14px;font-weight:700;color:var(--muted)}.review dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}a.btn{display:inline-flex;align-items:center;text-decoration:none}.save-state{align-self:center;font-size:14px;color:var(--muted)}
@media(max-width:860px){.page{padding-block:32px 64px}.workspace{grid-template-columns:1fr;gap:24px}.side{display:flex;flex-wrap:wrap;gap:8px}.side button{min-height:44px;padding:8px 16px}.form-grid{grid-template-columns:1fr}.login{padding:20px}.header .wrap{gap:12px}.header b{font-size:14px}.header .back{font-size:12px}.selection{flex-wrap:wrap}.selection .field{flex-basis:100%}.review dl{grid-template-columns:1fr;gap:4px}.review dd{margin-bottom:16px}}
.photo-preview{display:block;width:100%;max-width:320px;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--line)}.photo-actions{display:flex;flex-wrap:wrap;gap:12px}
</style></head><body>
<header class="header"><div class="wrap"><img src="__LOGO_DATA__" alt=""><b>SHIMANAMIの酒</b><a class="back" href="https://shimanami-sake-preview.woogie3.chatgpt.site/" target="_blank" rel="noopener noreferrer">サイトを見る</a></div></header>
<main class="wrap page"><h1>管理画面</h1><p class="lead">造り手、体験、イベントの内容を編集します。</p>
<p id="status" class="status" role="status" aria-live="polite" hidden></p>
<form id="login" class="login"><h2 id="login-title">管理者ログイン</h2><div class="field"><label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div id="confirm-field" class="field" hidden><label for="confirm">パスワード（確認）</label><input id="confirm" type="password" autocomplete="new-password"></div><button id="login-button" class="btn" type="submit">ログイン</button><p class="small" id="login-note">管理者のパスワードを入力してください。</p></form>
<div class="workspace" id="workspace" hidden><nav class="side" aria-label="管理メニュー"><button type="button" data-section="makers" aria-pressed="true">造り手</button><button type="button" data-section="experiences" aria-pressed="false">体験</button><button type="button" data-section="events" aria-pressed="false">イベント</button><button type="button" data-section="stats" aria-pressed="false">閲覧数</button><button type="button" id="logout">ログアウト</button></nav>
<section class="panel"><div class="panel-head"><h2 id="section-title">造り手</h2><span class="small" id="mode"></span></div><div id="edit-panel"><div class="selection"><div class="field"><label for="record">編集する項目</label><select id="record"></select></div><button type="button" class="btn ghost" id="add" hidden>新しく追加</button></div><form id="edit-form"><div class="form-grid" id="fields"></div><div class="actions"><button class="btn" id="save" type="submit">保存する</button><button class="btn ghost" id="preview" type="button">変更内容を確認</button><button class="btn ghost" id="reload" type="button">再読み込み</button><a id="saved-view" class="btn ghost" target="_blank" rel="noopener noreferrer" hidden>サイトで変更を確認</a><span class="save-state" id="save-state"></span></div></form></div><div id="stats-panel" hidden><p class="small">日本時間で集計したページの閲覧回数です。訪問者の人数とは異なります。</p><div id="stats-content"></div></div></section></div>
</main>
<dialog id="review" class="review" aria-labelledby="review-title"><h2 id="review-title" tabindex="-1">変更内容の確認</h2><p class="small">まだ保存していません。</p><dl id="review-fields"></dl><p id="review-status" class="status" role="status" hidden></p><div class="actions"><button type="button" id="review-save" class="btn">この内容で保存する</button><button type="button" id="review-back" class="btn ghost">修正に戻る</button></div></dialog>
<script>
const boot=__BOOTSTRAP_JSON__;
const definitions={makers:[['name','事業者名'],['kind','種類',['日本酒','ビール','ワイン','リキュール']],['sub','補助表記'],['area','地域'],['description','一覧の紹介文','textarea'],['body','詳しい紹介文','textarea'],['postal','郵便番号'],['address','住所'],['tel','電話'],['website','公式サイト'],['sns','SNS','sns'],['hours','営業時間'],['order','表示順','number']],experiences:[['id','ID（半角英数字・ハイフン）'],['category','種類',['見学','ペアリング','ガイド','診断','周遊']],['title','タイトル'],['description','紹介文','textarea'],['photo','写真','photo'],['price','料金'],['duration','所要時間'],['schedule','開催'],['place','場所'],['maker_id','関連する造り手'],['booking_url','予約URL'],['booking_label','予約ボタンの文字'],['sample','表示例','checkbox']],events:[['id','ID（半角英数字・ハイフン）'],['title','タイトル'],['description','内容','textarea'],['photo','写真','photo'],['start_date','開始日','date'],['end_date','終了日','date'],['time_text','時間'],['url','詳しく見るURL'],['sample','表示例','checkbox']]};
const titles={makers:'造り手',experiences:'体験',events:'イベント',stats:'閲覧数'};
let token=sessionStorage.getItem('shimanami.admin.session')||'',data=null,revision=0,section='makers',current=null,dirty=false,busy=false,reviewRecord=null,pendingPhoto=null;
const $=id=>document.getElementById(id);
function status(text){for(const id of ['status','review-status']){$(id).textContent=text;$(id).hidden=!text;}}
function markDirty(){dirty=true;$('save-state').textContent='未保存の変更があります';$('saved-view').hidden=true;status('');}
function rpc(request){return new Promise((resolve,reject)=>{if(!boot.connected||!window.google?.script?.run){reject(new Error('保存先がまだ接続されていません。'));return;}google.script.run.withSuccessHandler(result=>result?.ok?resolve(result):reject(new Error(result?.error||'操作に失敗しました。'))).withFailureHandler(()=>reject(new Error('通信に失敗しました。最新の内容を再読み込みして確認してください。'))).rpc({...request,token:request.token??token});});}
async function verifier(password){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(boot.salt),iterations:600000,hash:'SHA-256'},key,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function busyState(value){busy=value;document.querySelectorAll('#fields input,#fields textarea,#fields select,#fields button').forEach(control=>{control.disabled=value||!boot.connected||control.dataset.photoControl==='true'&&!boot.photosReady;});for(const id of ['save','preview','review-save'])$(id).disabled=value||!boot.connected;for(const id of ['record','reload','review-back'])$(id).disabled=value;$('add').disabled=value||!boot.connected;$('login-button').disabled=value||!boot.connected||boot.needsSetup&&!boot.canSetup;}
function confirmLeave(){return !dirty||window.confirm('保存していない内容があります。移動しますか？');}
function showLogin(){token='';sessionStorage.removeItem('shimanami.admin.session');$('workspace').hidden=true;$('login').hidden=false;}
function showEditor(selectedId){ $('login').hidden=true;$('workspace').hidden=false;$('mode').textContent=boot.connected?'Googleスプレッドシートに保存':'画面プレビュー・保存先未接続';showSection(section,selectedId); }
function showSection(key,selectedId){section=key;document.querySelectorAll('[data-section]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.section===key)));$('section-title').textContent=titles[key];$('stats-panel').hidden=key!=='stats';$('edit-panel').hidden=key==='stats';if(key==='stats'){showStats();return;}$('record').replaceChildren();data[key].forEach((record,index)=>{const option=document.createElement('option');option.value=index;option.textContent=record.name||record.title||record.id;$('record').append(option);});$('add').hidden=key==='makers';$('add').disabled=!boot.connected;const found=data[key].findIndex(x=>x.id===selectedId);selectRecord(found<0?0:found);}
function selectRecord(index){pendingPhoto=null;current=structuredClone(data[section][index]||blankRecord());$('record').value=data[section][index]?String(index):'';$('saved-view').hidden=true;dirty=false;$('save-state').textContent='';$('fields').replaceChildren();definitions[section].forEach(([key,label,type])=>{const box=document.createElement('div');box.className='field'+(type==='textarea'?' wide':'');const name=document.createElement('label');name.htmlFor='input-'+key;name.textContent=label;
if(type==='photo'){photoField(box,name);$('fields').append(box);return;}
if(key==='sns'){
 const list=document.createElement('div');list.id='input-sns';
 function addRow(value={name:'',url:''}){const row=document.createElement('div');row.className='sns-row';for(const [field,caption] of [['name','名前'],['url','URL']]){const captionElement=document.createElement('label');captionElement.textContent=caption;const control=document.createElement('input');control.dataset.sns=field;control.value=value[field]||'';control.type=field==='url'?'url':'text';control.required=true;control.disabled=!boot.connected;control.addEventListener('input',markDirty);captionElement.append(control);row.append(captionElement);}const remove=document.createElement('button');remove.type='button';remove.className='btn ghost';remove.textContent='削除';remove.disabled=!boot.connected;remove.addEventListener('click',()=>{row.remove();markDirty();});row.append(remove);list.append(row);}
 (current.sns||[]).forEach(addRow);const add=document.createElement('button');add.type='button';add.className='btn ghost';add.textContent='SNSを追加';add.disabled=!boot.connected;add.addEventListener('click',()=>{addRow();markDirty();});box.append(name,list,add);$('fields').append(box);return;
}
let input;if(Array.isArray(type)){input=document.createElement('select');type.forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;input.append(option);});}else{input=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type||'text';}input.id='input-'+key;input.name=key;input.disabled=!boot.connected;if(type==='checkbox')input.checked=Boolean(current[key]);else input.value=key==='sns'?JSON.stringify(current[key],null,2):current[key]??'';if(['name','title','id','start_date','end_date'].includes(key))input.required=true;if(key==='order'){input.min='1';input.step='1';}if(key==='id'&&data[section].some(x=>x.id===current.id))input.readOnly=true;if(input.tagName!=='SELECT'&&input.type!=='checkbox')input.maxLength=10000;input.addEventListener('input',markDirty);box.append(name,input);$('fields').append(box);});$('save').disabled=!boot.connected;}
function photoField(box,label){
 box.classList.add('wide');const input=document.createElement('input');input.id='input-photo';input.type='file';input.accept='image/jpeg,image/png,image/webp';input.hidden=true;input.dataset.photoControl='true';input.disabled=!boot.connected||!boot.photosReady;input.setAttribute('aria-describedby','photo-note');
 const choose=document.createElement('button');choose.type='button';choose.id='photo-choose';choose.className='btn ghost';choose.textContent='写真を選ぶ';choose.dataset.photoControl='true';choose.disabled=input.disabled;choose.addEventListener('click',()=>input.click());
 const image=document.createElement('img');image.id='photo-preview';image.className='photo-preview';image.alt='登録する写真のプレビュー';image.hidden=true;
 const note=document.createElement('p');note.id='photo-note';note.className='small';note.setAttribute('role','status');note.textContent=boot.connected&&boot.photosReady?'JPEG・PNG・WebP、10MB以下。保存時に写真を登録します。':'写真の保存先は接続準備中です。';
 const remove=document.createElement('button');remove.id='photo-remove';remove.type='button';remove.className='btn ghost';remove.textContent='写真を外す';remove.disabled=!boot.connected;remove.hidden=!current.photo;
 remove.addEventListener('click',()=>{current.photo='';pendingPhoto=null;input.value='';image.hidden=true;image.removeAttribute('src');remove.hidden=true;markDirty();note.textContent='保存すると写真の表示を外します。';});
 input.addEventListener('change',async()=>{
  const file=input.files[0];if(!file||busy)return;busyState(true);note.textContent='写真を読み込んでいます。';
  try{
   const base64=await preparePhoto(file);pendingPhoto={base64,preview:'data:image/jpeg;base64,'+base64};image.src=pendingPhoto.preview;image.hidden=false;remove.hidden=false;markDirty();note.textContent=file.name+'：写真を選択しました。まだ保存していません。';
  }catch(error){note.textContent=error.message;}finally{input.value='';busyState(false);}
 });
 const actions=document.createElement('div');actions.className='photo-actions';actions.append(choose,remove);box.append(label,input,actions,image,note);const selected=current,selectedPath=current.photo;
 if(/^uploads\/(experiences|events)\/[a-f0-9]{64}\.jpg$/.test(current.photo||'')){
  rpc({action:'photo',path:current.photo}).then(result=>{if(current===selected&&current.photo===selectedPath&&!pendingPhoto){image.src='data:image/jpeg;base64,'+result.base64;image.hidden=false;}}).catch(()=>{if(current===selected&&current.photo===selectedPath)note.textContent='登録済み写真を読み込めませんでした。再読み込みして確認してください。';});
 }else if(/^(?:photos|makers)\/[a-zA-Z0-9_-]+\.(?:jpg|jpeg|png|webp)$/.test(current.photo||'')){image.src='https://shimanami-sake-preview.woogie3.chatgpt.site/assets/'+current.photo;image.hidden=false;}
}
async function preparePhoto(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('JPEG・PNG・WebPの写真を選択してください。');
 if(file.size>10*1024*1024)throw new Error('10MB以下の写真を選択してください。');
 let bitmap;try{bitmap=await createImageBitmap(file);}catch{throw new Error('写真を読み込めません。別の写真を選択してください。');}
 try{
  const canvas=document.createElement('canvas');let edge=Math.min(1600,Math.max(bitmap.width,bitmap.height));
  while(edge>=Math.min(400,Math.max(bitmap.width,bitmap.height))){
   const scale=edge/Math.max(bitmap.width,bitmap.height);canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const context=canvas.getContext('2d');context.fillStyle='#FFFFFF';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(bitmap,0,0,canvas.width,canvas.height);
   for(const quality of [.85,.7,.5]){const result=canvas.toDataURL('image/jpeg',quality).split(',')[1];if(result&&Math.floor(result.length*3/4)<=256000)return result;}
   edge=Math.floor(edge*.75);
  }
  throw new Error('写真を小さくできませんでした。別の写真を選択してください。');
 }finally{bitmap.close();}
}
function blankRecord(){const template=Object.fromEntries(definitions[section].map(([key,,type])=>[key,type==='checkbox'?false:type==='number'?1:key==='sns'?[]:'']));if(section==='experiences'){template.category='見学';template.photo='';}return template;}
async function load(selectedId=current?.id){const result=await rpc({action:'load'});data=result.data;revision=result.revision;showEditor(selectedId);}
async function showStats(){
 const box=$('stats-content');box.replaceChildren();if(!boot.connected){box.textContent='Google接続後に閲覧数を表示します。';return;}
 try{
  const result=await rpc({action:'stats'});
  function table(caption,rows){const element=document.createElement('table');element.className='stats';element.createCaption().textContent=caption;for(const [label,count] of rows.length?rows:[['記録なし',0]]){const row=element.insertRow(),heading=document.createElement('th');heading.scope='row';heading.textContent=label;row.append(heading);row.insertCell().textContent=String(count);}box.append(element);}
  table('閲覧数',[['今日の閲覧数',result.counts.today],['最近7日間',result.counts.week],[result.clicks?'今月の閲覧数':'最近30日間',result.counts.month],['累計閲覧数',result.counts.total]]);
  table('ページ別（累計）',Object.entries(result.pages));
  if(result.clicks){
   const labels={website:'公式サイト',directions:'経路案内'};
   const links=Object.entries(result.links).map(([target,count])=>{const [kind,id,link,index]=target.split(':');const record=data[kind==='maker'?'makers':kind==='experience'?'experiences':'events'].find(x=>x.id===id);const label=record?.name||record?.title||target;return [label+(kind==='maker'?'（'+(link==='sns'?record?.sns[Number(index)]?.name||'SNS':labels[link]||link)+'）':''),count];});
   table('外部リンク（予約・案内）',[['今日のクリック数',result.clicks.today],['今月のクリック数',result.clicks.month],['累計クリック数',result.clicks.total],...links]);
  }else{const note=document.createElement('p');note.className='small';note.textContent='外部リンクの集計は接続先の更新後に利用できます。';box.append(note);}
 }catch(error){status(error.message);}
}
$('login').addEventListener('submit',async event=>{event.preventDefault();if(busy)return;if(boot.needsSetup&&$('password').value!==$('confirm').value){status('確認用のパスワードが一致しません。');return;}busyState(true);status('ログインを確認しています。');try{const key=await verifier($('password').value);$('password').value='';$('confirm').value='';if(boot.needsSetup){await rpc({action:'setup',verifier:key});boot.needsSetup=false;$('confirm-field').hidden=true;}$('login-title').textContent='管理者ログイン';const result=await rpc({action:'login',verifier:key});token=result.token;sessionStorage.setItem('shimanami.admin.session',token);await load();status('');}catch(error){status(error.message);}finally{busyState(false);}});
function editedRecord(){const record=structuredClone(current);definitions[section].forEach(([key,,type])=>{const input=$('input-'+key);record[key]=type==='photo'?current.photo||'':type==='checkbox'?input.checked:key==='sns'?[...input.querySelectorAll('.sns-row')].map(row=>({name:row.querySelector('[data-sns=name]').value,url:row.querySelector('[data-sns=url]').value})):type==='number'?Number(input.value):input.value;});return record;}
async function saveRecord(record){
 if(busy||!boot.connected)return;const collection=section;busyState(true);status('保存しています。');
 try{
  if(pendingPhoto){status('写真を保存しています。');const uploaded=await rpc({action:'upload',collection,base64:pendingPhoto.base64});record.photo=uploaded.path;}
  const result=await rpc({action:'save',collection,record,revision});pendingPhoto=null;revision=result.revision;
  const index=data[collection].findIndex(x=>x.id===record.id);if(index<0)data[collection].push(structuredClone(record));else data[collection][index]=structuredClone(record);
  current=structuredClone(record);dirty=false;if($('review').open)$('review').close();
  try{await load(record.id);status('保存しました。サイトを開き直すと反映されます。');}
  catch{showEditor(record.id);status('保存は完了しましたが、最新の内容を取得できませんでした。再読み込みして確認してください。');}
  const path=collection==='makers'?'makers/'+record.id+'/':collection==='experiences'?'#experience':'#events';
  $('saved-view').href='https://shimanami-sake-preview.woogie3.chatgpt.site/'+path;$('saved-view').hidden=false;
 }catch(error){status(error.message);}finally{busyState(false);}
}
$('edit-form').addEventListener('submit',event=>{event.preventDefault();if(!busy)saveRecord(editedRecord());});
$('preview').addEventListener('click',()=>{
 if(busy||!boot.connected||!$('edit-form').reportValidity())return;reviewRecord=editedRecord();$('review-fields').replaceChildren();
 definitions[section].forEach(([key,label,type])=>{const title=document.createElement('dt'),value=document.createElement('dd');title.textContent=label;const content=reviewRecord[key];if(type==='photo'){const source=pendingPhoto?.preview||$('photo-preview')?.getAttribute('src');if(source){const image=document.createElement('img');image.src=source;image.alt='保存する写真';image.className='photo-preview';value.append(image);}else value.textContent='写真なし';$('review-fields').append(title,value);return;}value.textContent=key==='sns'?content.map(x=>x.name+'：'+x.url).join('\n')||'未入力':type==='checkbox'?(content?'はい':'いいえ'):String(content??'')||'未入力';$('review-fields').append(title,value);});
 $('review-status').hidden=true;$('review').showModal();$('review-title').focus({preventScroll:true});$('review').scrollTop=0;
});
$('review-save').addEventListener('click',()=>saveRecord(reviewRecord));
$('review-back').addEventListener('click',()=>{if(!busy)$('review').close();});
$('review').addEventListener('cancel',event=>{if(busy)event.preventDefault();});
document.querySelectorAll('[data-section]').forEach(button=>button.addEventListener('click',()=>{if(!busy&&confirmLeave())showSection(button.dataset.section);}));
$('record').addEventListener('change',()=>{if(confirmLeave())selectRecord(Number($('record').value));else $('record').value=data[section].findIndex(x=>x.id===current.id);});
$('add').addEventListener('click',()=>{if(confirmLeave()){selectRecord(-1);$('record').value='';}});
$('reload').addEventListener('click',async()=>{if(!confirmLeave())return;try{await load();status('最新の内容を読み込みました。');}catch(error){status(error.message);}});
$('logout').addEventListener('click',async()=>{if(!confirmLeave())return;try{await rpc({action:'logout'});showLogin();status('ログアウトしました。');}catch(error){status(error.message);}});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
if(!boot.connected){$('password').disabled=true;status('Google接続の準備中です。ログインと保存、閲覧数の記録はまだ利用できません。');$('login-note').textContent='接続後は管理者パスワードだけでログインします。';if(boot.previewData){data=boot.previewData;showEditor();$('login').hidden=false;$('logout').hidden=true;}}
else if(boot.needsSetup){$('login-title').textContent='管理者パスワードの初期設定';$('confirm-field').hidden=false;$('confirm').required=true;$('password').autocomplete='new-password';$('login-button').textContent='パスワードを設定する';$('login-note').textContent='数字のみでも、好きな長さで設定できます。';if(!boot.canSetup)status('初期設定には所有者のGoogleアカウントでの確認が必要です。');}
else if(token)load().catch(error=>{showLogin();status(error.message);});
busyState(false);
</script></body></html>
